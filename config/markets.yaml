# Category / subcategory keyword rules used by app/polymarket/categorize.py.
# Matching is a simple case-insensitive substring match against the market
# question + parent event title + event tags.
#
# This file defines classification rules only. Which (category, subcategory)
# pairs actually get fed into the Stage 2 analysis pipeline is a SEPARATE,
# narrower allowlist: config/profile.yaml's `target_subcategories`. Markets
# that match nothing here are still stored, tagged category="other",
# subcategory="uncategorized" - nothing discovered is discarded.
#
# Current target universe (see profile.yaml): politics/elon_musk_tweets,
# politics/white_house_tweets, crypto/btc_up_down, sports/basketball.

categories:
  politics:
    elon_musk_tweets:
      # Posting/tweet-context only - a market merely mentioning Elon Musk
      # (e.g. "Will Elon Musk buy X?", "Will Elon Musk become CEO of X?")
      # must NOT match. No bare "elon musk" pairing.
      keywords:
        - "elon musk tweet"
        - "elon musk tweets"
        - "elon musk post"
        - "elon musk posts"
        - "elon tweet"
        - "elon tweets"
        - "elon post"
        - "elon posts"
        - "musk tweet"
        - "musk tweets"
        - "musk post"
        - "musk posts"
        - "posts will elon musk"
        - "tweets will elon musk"
        - "@elonmusk"
    white_house_tweets:
      # Posting/tweet-context only - a market merely mentioning "White
      # House" (press secretary appointments, personnel, policy, briefings,
      # visits) must NOT match. No bare "white house".
      keywords:
        - "white house tweet"
        - "white house tweets"
        - "white house post"
        - "white house posts"
        - "posts will the white house"
        - "posts will white house"
        - "tweets will the white house"
        - "@whitehouse"
        - "potus tweet"
        - "potus tweets"
        - "potus post"
        - "potus posts"

  crypto:
    btc_up_down:
      # Bitcoin/BTC-specific only - deliberately no generic crypto terms so
      # ETH/SOL/etc. markets never match this rule.
      keywords:
        - "bitcoin up or down"
        - "btc up or down"
        - "will bitcoin"
        - "will btc"
        - "bitcoin price up"
        - "bitcoin price down"
        - "btc price up"
        - "btc price down"
        - "bitcoin above"
        - "bitcoin below"
        - "bitcoin higher"
        - "bitcoin lower"
        - "btc above"
        - "btc below"
        - "btc higher"
        - "btc lower"

  sports:
    basketball:
      # Basketball-specific terms only - no generic "sports"/"league"/"vs"
      # catch-alls, so football/tennis/baseball/hockey/etc. never match.
      keywords:
        - "basketball"
        - "nba"
        - "wnba"
        - "ncaa basketball"
        - "ncaab"
        - "college basketball"
        - "euroleague"
