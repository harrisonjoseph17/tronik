# Category / subcategory keyword rules used by app/polymarket/categorize.py.
# Matching is a simple case-insensitive substring match against the market
# question + parent event title + event tags.
#
# This file defines classification rules only. Which (category, subcategory)
# pairs actually get fed into the Stage 2 analysis pipeline is a SEPARATE,
# narrower allowlist: config/profile.yaml's `target_subcategories`. Markets
# that match nothing here are still stored, tagged category="other",
# subcategory="uncategorized" - nothing discovered is discarded.
#
# Current target universe (see profile.yaml): politics/elon_musk,
# politics/white_house, crypto/btc_up_down, sports/basketball.

categories:
  politics:
    elon_musk:
      # Avoid bare "elon" or "musk" alone - too broad on their own per the
      # narrowing requirements. Require the pairing or an explicit
      # posting-context phrase instead.
      keywords:
        - "elon musk"
        - "elon tweet"
        - "elon post"
        - "@elonmusk"
        - "musk tweet"
        - "musk tweets"
        - "musk post"
        - "musk posts"
    white_house:
      keywords:
        - "white house"
        - "white house tweet"
        - "white house post"
        - "white house tweets"
        - "white house posts"
        - "@whitehouse"
        - "potus tweet"
        - "potus post"

  crypto:
    btc_up_down:
      # Bitcoin/BTC-specific only - deliberately no generic crypto terms so
      # ETH/SOL/etc. markets never match this rule.
      keywords:
        - "bitcoin up or down"
        - "btc up or down"
        - "will bitcoin"
        - "will btc"
        - "bitcoin price up"
        - "bitcoin price down"
        - "btc price up"
        - "btc price down"
        - "bitcoin above"
        - "bitcoin below"
        - "bitcoin higher"
        - "bitcoin lower"
        - "btc above"
        - "btc below"
        - "btc higher"
        - "btc lower"

  sports:
    basketball:
      # Basketball-specific terms only - no generic "sports"/"league"/"vs"
      # catch-alls, so football/tennis/baseball/hockey/etc. never match.
      keywords:
        - "basketball"
        - "nba"
        - "wnba"
        - "ncaa basketball"
        - "ncaab"
        - "college basketball"
        - "euroleague"
